name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check required files exist
        run: |
          test -f docs/raceday_schema.sql && echo "SQL script found" || (echo "Missing SQL script" && exit 1)
          test -f docs/api_endpoint_plan.md && echo "Endpoint plan found" || (echo "Missing endpoint plan" && exit 1)

          Add CI/CD workflow to validate docs folder.
